name: Deploy (OVH)

# Auto-deploy du code sur le VPS OVH à chaque push sur main.
# NE TOUCHE JAMAIS LA BASE DE DONNÉES : git pull + install + build + pm2 restart.
# Les migrations SQL restent un acte manuel et gaté (cf sql/*.sql).
# Déclenchable aussi à la main (workflow_dispatch).

# docs/** et **.md ne sont PLUS ignorés : /admin/kickoff sert
# docs/kickoff-nouvelle-saison.md à la requête, une modif du guide doit
# donc déployer.
on:
  push:
    branches: [main]
    paths-ignore:
      - "tasks/**"
      - "sql/**"
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             cd /opt/la-ligue-enchantee
             echo "== git pull =="
             git fetch origin main
             git reset --hard origin/main
             echo "== npm install (ci si lock change) =="
             npm install --no-audit --no-fund
             echo "== build (prisma generate + next build) =="
             npm run build
             echo "== pm2 restart =="
             pm2 restart ligue --update-env
             pm2 save
             echo "== done =="'
